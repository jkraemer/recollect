[package]
name = "recollect"
version = "0.2.0"
edition = "2024"
description = "Persistent, searchable memory for coding agents"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
fastembed = { version = "7.1", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
gethostname = "1.1"
rcgen = "0.14"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite-vec = "0.1.9"
thiserror = "2.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
uuid = { version = "1.26", features = ["v7"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
