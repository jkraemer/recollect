[package]
name = "recollect"
version = "0.1.0"
edition = "2024"
description = "Persistent, searchable memory for coding agents"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite-vec = "0.1.9"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
