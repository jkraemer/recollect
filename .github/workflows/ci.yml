name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs supersede each other; auto-cancelling by ref would also
  # apply to master pushes, leaving the first of two quick pushes with no
  # CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake rubocop

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.5 is intentionally absent: setup-ruby resolves "3.5" to the
        # 3.5.0-preview1 build, and sqlite3 currently caps itself at
        # "< 3.5.dev", so bundler fails to resolve and the leg can never
        # pass. Re-add once sqlite3 ships Ruby 3.5 support.
        ruby: ["3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the toolchain; the runner's rustup installs it
      # and its components on the first cargo call.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # A per-run key with a prefix restore-key: a bad entry is replaced on the
      # next save instead of being restored verbatim forever.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .model-cache
          key: embedding-model-bge-small-en-v1.5-q-${{ github.run_id }}
          restore-keys: |
            embedding-model-bge-small-en-v1.5-q-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo llvm-cov --fail-under-lines 80
