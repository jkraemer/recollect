name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs supersede each other; auto-cancelling by ref would also
  # apply to master pushes, leaving the first of two quick pushes with no
  # CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the toolchain; the runner's rustup installs it
      # and its components on the first cargo call.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # A per-run key with a prefix restore-key: a bad entry is replaced on the
      # next save instead of being restored verbatim forever.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: .model-cache
          key: embedding-model-bge-small-en-v1.5-q-${{ github.run_id }}
          restore-keys: |
            embedding-model-bge-small-en-v1.5-q-
      - run: cargo fmt --check
      - run: shellcheck install.sh .github/scripts/release-smoke-test.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo llvm-cov --fail-under-lines 80
