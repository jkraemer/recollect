name: Nightly

on:
  schedule:
    # 02:27 in +0800. Off the hour on purpose: GitHub's scheduler is most
    # congested at :00, where runs are delayed or dropped.
    - cron: "27 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A workflow_dispatch must queue behind the cron (and vice versa), not race
# it over the same cache key or kill it mid-suite.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECOLLECT_ENABLE_VECTORS: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # The per-run key never exact-hits, so every run restores the newest
      # prior entry via the prefix and saves a fresh one. With a fixed key,
      # the first saved entry - even a partial one - would be served
      # verbatim forever, and the save step would never run again.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2-${{ github.run_id }}
          restore-keys: |
            huggingface-all-MiniLM-L6-v2-

      # Torch first, from the CPU index. The default PyPI Linux wheel bundles
      # CUDA libraries and runs 2-3 GB against roughly 200 MB here, and the
      # runner has no GPU to use them with.
      - name: Install the embedding stack
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Resolve the vector stack paths
        run: |
          echo "RECOLLECT_PYTHON=$(which python)" >> "$GITHUB_ENV"
          # loadable_path() returns the extension-less stem SQLite's own
          # load_extension expects; recollect's config checks File.exist? on
          # a real file, so append the platform suffix (.so on ubuntu-latest).
          echo "RECOLLECT_SQLITE_VEC_PATH=$(python -c 'import sqlite_vec; print(sqlite_vec.loadable_path())').so" >> "$GITHUB_ENV"

      # The vector tests skip when the stack is missing, so a misconfigured job
      # would report success while testing nothing. Fail loudly instead by
      # exercising the stack for real (vectors_available? only predicts it --
      # see bin/verify-vector-stack for why that's not enough).
      - name: Verify the vector stack is live
        run: bundle exec ruby bin/verify-vector-stack

      - run: bundle exec rake coverage
