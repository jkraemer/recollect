name: Nightly

on:
  schedule:
    # 02:27 in +0800. Off the hour on purpose: GitHub's scheduler is most
    # congested at :00, where runs are delayed or dropped.
    - cron: "27 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECOLLECT_ENABLE_VECTORS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      # Torch first, from the CPU index. The default PyPI Linux wheel bundles
      # CUDA libraries and runs 2-3 GB against roughly 200 MB here, and the
      # runner has no GPU to use them with.
      - name: Install the embedding stack
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt sqlite-vec

      - name: Resolve the vector stack paths
        run: |
          echo "RECOLLECT_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "RECOLLECT_SQLITE_VEC_PATH=$(python -c 'import sqlite_vec; print(sqlite_vec.loadable_path())')" >> "$GITHUB_ENV"

      # The vector tests skip when the stack is missing, so a misconfigured job
      # would report success while testing nothing. Fail loudly instead.
      - name: Verify the vector stack is live
        run: >
          bundle exec ruby -Ilib -e 'require "recollect";
          abort(Recollect.config.vector_status_message) unless Recollect.config.vectors_available?'

      - run: bundle exec rake coverage
